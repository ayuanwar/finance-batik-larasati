<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" fill="none">
  <defs>
    <!-- Gradasi Batang Bambu -->
    <linearGradient id="bambuGrad" x1="20" y1="45" x2="55" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c6915b" />
      <stop offset="50%" stop-color="#dfa972" />
      <stop offset="100%" stop-color="#e8ba84" />
    </linearGradient>

    <!-- Gradasi Shading Bambu (Silinder) -->
    <linearGradient id="bambuShade" x1="22" y1="30" x2="16" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eed2ab" />
      <stop offset="60%" stop-color="#dfa972" />
      <stop offset="100%" stop-color="#b47c45" />
    </linearGradient>

    <!-- Gradasi Nyamplungan (Kuningan/Emas) -->
    <linearGradient id="emasNyamplungan" x1="10" y1="35" x2="25" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2b43b" />
      <stop offset="30%" stop-color="#f5ce58" />
      <stop offset="70%" stop-color="#c99723" />
      <stop offset="100%" stop-color="#9a6e13" />
    </linearGradient>

    <!-- Gradasi Lubang Dalam Nyamplungan -->
    <linearGradient id="lubangMalam" x1="12" y1="30" x2="19" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4e330a" />
      <stop offset="100%" stop-color="#785317" />
    </linearGradient>

    <!-- Gradasi Cucuk Canting -->
    <linearGradient id="cucukGrad" x1="14" y1="46" x2="4" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0c64d" />
      <stop offset="50%" stop-color="#c99522" />
      <stop offset="100%" stop-color="#936710" />
    </linearGradient>

    <!-- Filter Drop Shadow Halus -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#06130D" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- 1. GAGANG BAMBU -->
    <!-- Batang Utama -->
    <path
      d="M 21.5,43 L 50,11.5 C 51.5,10 53.5,9.5 55,11 C 56.5,12.5 56,14.5 54.5,16 L 24.5,47 C 23.2,46.2 22.2,44.8 21.5,43 Z"
      fill="url(#bambuGrad)"
      stroke="#533314"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Highlight Silinder Bambu Bagian Atas -->
    <path
      d="M 23,41.5 L 49.5,12"
      stroke="#fce7c8"
      stroke-width="0.9"
      stroke-linecap="round"
      opacity="0.6"
    />

    <!-- Penampang Ujung Bambu (Oval Lubang) -->
    <ellipse
      cx="53"
      cy="13"
      rx="2.6"
      ry="4.2"
      transform="rotate(-45 53 13)"
      fill="#eed2ab"
      stroke="#533314"
      stroke-width="1.1"
    />
    <ellipse
      cx="53"
      cy="13"
      rx="1.3"
      ry="2.4"
      transform="rotate(-45 53 13)"
      fill="#b8834d"
      stroke="#533314"
      stroke-width="0.7"
    />

    <!-- Cincin Ruas Bambu -->
    <path
      d="M 46.5,12 C 48.2,14.5 49.8,17 50.8,19"
      stroke="#533314"
      stroke-width="1"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 45.2,13.2 C 46.8,15.7 48.5,18.2 49.5,20.2"
      stroke="#7c4e20"
      stroke-width="0.8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 2. NYAMPLUNGAN (WADAH EMAS KUNINGAN) -->
    <!-- Badan Kerucut Mangkuk Nyamplungan -->
    <path
      d="M 11.5,33.5 C 12,38 13.5,43 15.5,45.5 C 16.5,46 17.5,45.5 18.5,44.5 C 21.5,42.5 24,37 24.5,32.5 C 22,31 14,31.5 11.5,33.5 Z"
      fill="url(#emasNyamplungan)"
      stroke="#4a300a"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Highlight Lengkung Kilau Emas pada Nyamplungan -->
    <path
      d="M 13.2,35 C 13.8,38.5 14.8,42 16.2,44"
      stroke="#fff3b0"
      stroke-width="0.9"
      stroke-linecap="round"
      fill="none"
      opacity="0.8"
    />

    <!-- Mulut / Bibir Atas Nyamplungan (Elips) -->
    <ellipse
      cx="17"
      cy="32.5"
      rx="4.2"
      ry="6.5"
      transform="rotate(-48 17 32.5)"
      fill="url(#lubangMalam)"
      stroke="#4a300a"
      stroke-width="1.2"
    />

    <!-- Bibir Dalam Tembaga Emas -->
    <ellipse
      cx="17.3"
      cy="32.7"
      rx="3.2"
      ry="5.2"
      transform="rotate(-48 17 32.5)"
      fill="#5a380a"
      stroke="#d4a327"
      stroke-width="0.6"
    />

    <!-- 3. KAWAT / TALI PENGIKAT -->
    <!-- Tali Penyangga Atas (Dari Bibir Nyamplungan ke Batang Bambu) -->
    <path
      d="M 21.5,31 C 24,30.5 26.5,29.5 27.5,28.5"
      stroke="#874716"
      stroke-width="1.1"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Tali Pengikat Diagonal Mengelilingi Bambu -->
    <path
      d="M 15.5,45.5 C 18,44 21.5,40.5 24.5,32.5"
      stroke="#874716"
      stroke-width="1.3"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 16.5,46.5 C 19,45 22.5,41.5 25.5,33.5"
      stroke="#532707"
      stroke-width="0.8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Lilitan Cincin Kawat di Leher Bawah / Pangkal Cucuk -->
    <path
      d="M 13.5,44.5 C 14.8,45.8 16.2,46.5 17.2,45.8"
      stroke="#874716"
      stroke-width="1.3"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 13,46 C 14.3,47.3 15.8,47.8 16.8,47.1"
      stroke="#532707"
      stroke-width="1.3"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 4. CUCUK CANTING (CORONG LOGAM EMAS MELENGKUNG KE KIRI BAWAH) -->
    <!-- Bentuk Cucuk Runcing -->
    <path
      d="M 15,46.5 C 14,49.5 11.5,53.5 8.5,56.8 C 6.8,58.8 5,60.8 3,61 C 3.2,59.8 4.5,57.5 6.5,54.5 C 9.5,50 12.8,46.8 14.2,45.2 Z"
      fill="url(#cucukGrad)"
      stroke="#4a300a"
      stroke-width="1"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Kilau Garis Lengkung Punggung Cucuk -->
    <path
      d="M 14,47 C 12.5,50 10,54 7,57 C 5.5,58.5 4,59.8 3,61"
      stroke="#ffe58f"
      stroke-width="0.6"
      stroke-linecap="round"
      fill="none"
      opacity="0.85"
    />
  </g>
</svg>
